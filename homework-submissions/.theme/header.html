<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Сданные работы — Просмотр наличия</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: #e5e7eb;
      padding: 24px 38px;
      margin: 0;
    }
    .page-title {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #60a5fa;
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 14px 0;
    }
    .mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 12px;
      color: #fca5a5;
      font-size: 14px;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .breadcrumbs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      background: #1f2937;
      color: #cbd5e1;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 15px;
      margin-bottom: 20px;
      width: fit-content;
      max-width: 100%;
    }
    .breadcrumbs span.label {
      color: #9ca3af;
      margin-right: 4px;
    }
    .breadcrumbs a {
      color: #93c5fd;
      text-decoration: none;
      padding: 3px 8px;
      border-radius: 8px;
      background: #111827;
    }
    .breadcrumbs a:hover {
      background: #374151;
      text-decoration: none;
    }
    .breadcrumbs .separator {
      color: #6b7280;
    }
    a {
      color: #93c5fd;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    table {
      width: 100%;
      background: #1f2937;
      border-radius: 12px;
      padding: 15px;
      margin-top: 4px;
    }
    th, td {
      padding: 8px 12px;
    }
    /* Directory links stay clickable */
    tbody tr td.link a[href$="/"] {
      font-weight: 600;
    }
    /* File links are non-clickable and show lock icon */
    tbody tr td.link a:not([href$="/"]):not([href^="?"]) {
      pointer-events: none;
      cursor: default;
      color: #cbd5e1;
      text-decoration: none;
    }
    tbody tr td.link a:not([href$="/"]):not([href^="?"])::after {
      content: " 🔒 (только наличие)";
      font-size: 12px;
      color: #94a3b8;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <h1 class="page-title">📁 Сданные работы (СИЭУиП)</h1>
  <div class="mode-badge">
    <span>🔒 <strong>Режим просмотра наличия:</strong> скачивание и просмотр содержимого файлов отключены. Вы можете проверять только факт сдачи, дату и размер.</span>
  </div>
  <div class="breadcrumbs" id="breadcrumbs">
    <span class="label">📍 Путь:</span>
  </div>
  <script>
    const breadcrumbs = document.getElementById("breadcrumbs");
    const path = decodeURIComponent(window.location.pathname);
    const parts = path.split("/").filter(Boolean);
    function addLink(name, href) {
      const link = document.createElement("a");
      link.textContent = name;
      link.href = href;
      breadcrumbs.appendChild(link);
    }
    function addSeparator() {
      const separator = document.createElement("span");
      separator.className = "separator";
      separator.textContent = "/";
      breadcrumbs.appendChild(separator);
    }
    addLink("Главная", "/");
    let currentPath = "/";
    parts.forEach((part) => {
      addSeparator();
      currentPath += part + "/";
      addLink(part, currentPath);
    });
  </script>
