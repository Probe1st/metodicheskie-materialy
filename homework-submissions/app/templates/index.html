<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сдача заданий</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="{{ url_for('index') }}">Учебный портал</a>
      <div class="header-actions">
        <span class="header-label">Приём заданий</span>
        <a class="button button--quiet" href="{{ url_for('admin_dashboard') }}">Панель преподавателя</a>
      </div>
    </div>
  </header>

  <main class="page-shell student-layout">
    <section class="student-layout__intro" aria-labelledby="page_title">
      <p class="eyebrow">Загрузка домашней работы</p>
      <h1 id="page_title">Сдать работу.<br>Без лишнего.</h1>
      <p class="lead">Подтвердите доступ своей группы, заполните данные и загрузите готовый файл.</p>
    </section>

    <section class="panel form-card" aria-label="Форма сдачи работы">
      <form id="unlock" class="form-stack" method="post" action="{{ url_for('unlock') }}">
        <div>
          <p class="eyebrow">Шаг 1 из 2</p>
          <h2>Подтвердите группу</h2>
        </div>
        <label class="field">Группа
          <select name="group" required>
            {% for group in catalog.groups %}
              <option>{{ group }}</option>
            {% endfor %}
          </select>
        </label>
        <label class="field">Пароль группы
          <input name="password" type="password" required autocomplete="current-password">
        </label>
        <button class="button button--primary" type="submit">Открыть форму</button>
        <p class="status" id="unlock_status" aria-live="polite"></p>
      </form>

      <div class="access-summary" id="access_summary" hidden>
        <div>
          <p class="eyebrow">Доступ подтверждён</p>
          <strong id="group_display"></strong>
        </div>
        <button class="button button--outline" id="change_group" type="button">Сменить группу</button>
      </div>

      <form id="submit" class="form-stack" method="post" action="{{ url_for('submit') }}" enctype="multipart/form-data" hidden>
        <input id="selected_group" name="group" type="hidden">
        <div>
          <p class="eyebrow">Шаг 2 из 2</p>
          <h2>Расскажите о работе</h2>
        </div>
        <section class="form-section" aria-label="Данные работы">
          <label class="field">Дисциплина
            <select id="discipline" name="discipline" required>
              {% for name in catalog.disciplines %}
                <option>{{ name }}</option>
              {% endfor %}
            </select>
          </label>
          <label class="field">Наименование работы
            <input id="work" name="work" list="works" required autocomplete="off">
            <span class="field__hint">Начните вводить название или выберите вариант из списка.</span>
            <datalist id="works"></datalist>
          </label>
          <label class="field">ФИО
            <input name="student_name" required autocomplete="name">
          </label>
        </section>
        <section class="form-section" aria-label="Файл работы">
          <label class="file-picker">
            <span class="file-picker__title">Выберите файл</span>
            <span class="file-picker__detail" id="file_name">Файл до {{ limit }} ГБ</span>
            <input id="file" name="file" type="file" required>
          </label>
        </section>
        <button class="button button--primary" type="submit">Отправить работу</button>
        <p class="status" id="submit_status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script>
    window.submissionCatalog = {{ catalog.disciplines|tojson }};
    window.submissionLimit = {{ limit|tojson }};
  </script>
  <script src="{{ url_for('static', filename='student.js') }}" defer></script>
</body>
</html>
