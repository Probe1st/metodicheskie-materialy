<dialog id="app_dialog" class="modal-dialog" aria-labelledby="app_dialog_title" aria-describedby="app_dialog_message">
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="app_dialog_title" class="modal-title"></h2>
      <button type="button" class="modal-close-btn" id="app_dialog_close" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <p id="app_dialog_message" class="modal-message"></p>
      <div id="app_dialog_details" class="modal-details" hidden></div>
      <p id="app_dialog_hint" class="modal-hint" hidden></p>
    </div>
    <div class="modal-actions">
      <button type="button" class="button button--primary" id="app_dialog_accept">Подтвердить</button>
      <button type="button" class="button button--outline" id="app_dialog_cancel">Отмена</button>
    </div>
  </div>
</dialog>
