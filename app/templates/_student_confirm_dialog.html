<dialog id="student_confirm_dialog" class="modal-dialog" aria-labelledby="student_dialog_title" aria-describedby="student_dialog_message">
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="student_dialog_title" class="modal-title"></h2>
      <button type="button" class="modal-close-btn" id="student_dialog_close" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <p id="student_dialog_message" class="modal-message"></p>
      <div id="student_dialog_preview" class="modal-details" hidden></div>
      <p id="student_dialog_warnings" class="status" data-state="warning" role="status" hidden></p>
      <div id="student_dialog_matches" class="modal-matches" hidden></div>
    </div>
    <div class="modal-actions modal-actions--wrap">
      <button type="button" class="button button--outline" id="student_dialog_pick_list_btn" hidden>Выбрать из списка</button>
      <button type="button" class="button button--outline" id="student_dialog_cancel_btn">Отмена</button>
      <button type="button" class="button button--primary" id="student_dialog_confirm_btn">Всё равно создать нового</button>
    </div>
  </div>
</dialog>
